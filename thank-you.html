<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Mulish:wght@300;400;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      referrerpolicy="no-referrer"
    />

    <title>Message sent | Oumar Diagne</title>
  </head>

  <body>
    <main class="thank-you-page">
      <i class="fa-solid fa-circle-check thank-you-icon" aria-hidden="true"></i>

      <h1 id="thank-you-title">Thank you for your message</h1>

      <p id="thank-you-text">
        Your message has been sent successfully. I will get back to you as soon
        as possible.
      </p>

      <a id="thank-you-link" class="thank-you-link" href="./index.html">
        Return to my CV
      </a>
    </main>

    <script>
      const language =
        new URLSearchParams(window.location.search).get("lang") || "en";

      const translations = {
        en: {
          documentLanguage: "en",
          pageTitle: "Message sent | Oumar Diagne",
          title: "Thank you for your message",
          text: "Your message has been sent successfully. I will get back to you as soon as possible.",
          linkText: "Return to my CV",
          linkHref: "./index.html",
        },
        fr: {
          documentLanguage: "fr",
          pageTitle: "Message envoyé | Oumar Diagne",
          title: "Merci pour votre message",
          text: "Votre message a bien été envoyé. Je vous répondrai dès que possible.",
          linkText: "Retour au CV",
          linkHref: "./cv-fr.html",
        },
        it: {
          documentLanguage: "it",
          pageTitle: "Messaggio inviato | Oumar Diagne",
          title: "Grazie per il tuo messaggio",
          text: "Il tuo messaggio è stato inviato correttamente. Ti risponderò il prima possibile.",
          linkText: "Torna al mio CV",
          linkHref: "./cv-it.html",
        },
      };

      const content = translations[language] || translations.en;

      document.documentElement.lang = content.documentLanguage;
      document.title = content.pageTitle;

      document.getElementById("thank-you-title").textContent = content.title;
      document.getElementById("thank-you-text").textContent = content.text;

      const link = document.getElementById("thank-you-link");
      link.textContent = content.linkText;
      link.href = content.linkHref;
    </script>
  </body>
</html>
